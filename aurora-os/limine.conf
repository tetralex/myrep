# Limine-Bootmenü
timeout: 5

/AuroraOS
    protocol: limine
    path: boot():/boot/kernel

# Ordner mit Absturz-Tests („+“ = standardmäßig aufgeklappt)
/+Absturz-Tests
    //Page Fault
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=pagefault

    //Double Fault (kaputter Stack)
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=doublefault

    //Allgemeine Schutzverletzung
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=gpf

    //Division durch Null
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=divide

    //Ungültiger Befehl
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=opcode

    //Code im Heap ausführen (NX-Schutz)
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=nx

    //Heap voll (Out of Memory)
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=oom

    //Stack-Überlauf in einem Thread
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=stack

    //Rust-Panic
        protocol: limine
        path: boot():/boot/kernel
        cmdline: crash=panic
